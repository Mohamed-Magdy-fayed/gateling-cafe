name: Local Announcer (win-x64)

on:
  workflow_dispatch:
  push:
    branches:
      - stage
    tags:
      - "announcer-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          .\local-announcer\publish-win-x64.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gateling.Announcer-win-x64
          path: local-announcer/dist/Gateling.Announcer.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: local-announcer/dist/Gateling.Announcer.exe
